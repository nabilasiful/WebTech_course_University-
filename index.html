
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Donor Registration</title>

    <style>
    
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f0ff;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 650px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #7041a6;
}

form {
    background: white;
    border: 2px solid #a855f7;
    border-radius: 8px;
    padding: 25px;
}

.group {
    margin-bottom: 15px;
}

label {
    display: inline-block;
    width: 145px;
}

input:not([type="radio"]):not([type="checkbox"]),
select {
    padding: 7px;
    width: 220px;
    max-width: 100%;
    border: 1px solid #b9a2d6;
    border-radius: 4px;
}

input[type="radio"],
input[type="checkbox"] {
    width: auto;
}

.error {
    display: block;
    color: #e63946;
    font-size: 13px;
    margin-left: 150px;
    margin-top: 4px;
}

button {
    padding: 8px 15px;
    cursor: pointer;
}

.register {
    background: #7041a6;
    color: white;
    border: none;
    border-radius: 4px;
}

.register:hover {
    background: #542d85;
}

.remove {
    background: #e05b78;
    color: white;
    border: none;
    border-radius: 4px;
}

.remove:hover {
    background: #c0395b;
}

#count {
    text-align: center;
    font-weight: bold;
    margin: 20px 0;
    color: #7041a6;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

th, td {
    border: 1px solid #c8b8dc;
    padding: 10px;
    text-align: left;
}

th {
    background: #e8d9f5;
    color: #542d85;
}

@media (max-width: 500px) {
    label {
        width: 100%;
        margin-bottom: 5px;
    }

    .error {
        margin-left: 0;
    }

    table {
        font-size: 12px;
    }

    th, td {
        padding: 6px;
    }
}

    </style>
</head>

<body>

<div class="container">

    <h1>Blood Donor Registration</h1>

    <form id="regForm" method="post" action="#" novalidate onsubmit="return validateForm()">

        <div class="group">
            <label for="fname">Full Name:</label>
            <input type="text" id="fname" name="fname" required minlength="3">
            <span class="error" id="err-fname"></span>
        </div>

        <div class="group">
            <label for="sid">AIUB ID:</label>
            <input type="text" id="sid" name="sid" required pattern="[0-9]{2}-[0-9]{5}-[0-9]">
            <span class="error" id="err-sid"></span>
        </div>

        <div class="group">
            <label for="phone">Mobile:</label>
            <input type="text" id="phone" name="phone" required pattern="[0-9]{11}">
            <span class="error" id="err-phone"></span>
        </div>

        <div class="group">
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required min="18" max="60">
            <span class="error" id="err-age"></span>
        </div>

        <div class="group">
            <label for="bgroup">Blood Group:</label>
            <select id="bgroup" name="bgroup" required>
                <option value="">Select blood group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>
            <span class="error" id="err-bgroup"></span>
        </div>

        <div class="group">
            <label>Donated before?</label>

            <input type="radio" id="donated-yes" name="donated" value="Yes">
            <label for="donated-yes" style="width:auto;">Yes</label>

            <input type="radio" id="donated-no" name="donated" value="No">
            <label for="donated-no" style="width:auto;">No</label>

            <span class="error" id="err-donated"></span>
        </div>

        <div class="group">
            <input type="checkbox" id="agree" name="agree" required>
            <label for="agree" style="width:auto;">
                I am healthy and willing to donate
            </label>
            <span class="error" id="err-agree"></span>
        </div>

        <div class="group">
            <label for="pass">Password:</label>
            <input type="password" id="pass" name="pass" required minlength="6">
            <span class="error" id="err-pass"></span>
        </div>

        <div class="group">
            <label for="pass2">Confirm Password:</label>
            <input type="password" id="pass2" name="pass2" required>
            <span class="error" id="err-pass2"></span>
        </div>

        <button type="submit" class="register">Register Donor</button>

    </form>

    <p id="count">Total donors: 0</p>

    <table id="list">
        <thead>
            <tr>
                <th>Name</th>
                <th>ID</th>
                <th>Blood Group</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="donorBody"></tbody>
    </table>

</div>

<script>
    let donors = [];

    function validateForm() {

        let name = document.getElementById("fname").value.trim();
        let id = document.getElementById("sid").value.trim();
        let phone = document.getElementById("phone").value.trim();
        let ageValue = document.getElementById("age").value;
        let age = Number(ageValue);
        let group = document.getElementById("bgroup").value;

        let donated = document.querySelector('input[name="donated"]:checked');
        let agree = document.getElementById("agree").checked;

        let password = document.getElementById("pass").value;
        let confirmPassword = document.getElementById("pass2").value;

        let fields = ["fname", "sid", "phone", "age", "bgroup", "donated", "agree", "pass", "pass2"];

        for (let i = 0; i < fields.length; i++) {
            document.getElementById("err-" + fields[i]).innerText = "";
        }

        let valid = true;

        if (name.length < 3) {
            document.getElementById("err-fname").innerText = "Name must have at least 3 characters";
            valid = false;
        }

        let idPattern = /^[0-9]{2}-[0-9]{5}-[0-9]$/;

        if (!idPattern.test(id)) {
            document.getElementById("err-sid").innerText = "ID must be in format 22-12345-1";
            valid = false;
        }

        let phonePattern = /^[0-9]{11}$/;

        if (!phonePattern.test(phone)) {
            document.getElementById("err-phone").innerText = "Mobile must be exactly 11 digits";
            valid = false;
        }

        if (ageValue === "" || age < 18 || age > 60) {
            document.getElementById("err-age").innerText = "Age must be between 18 and 60";
            valid = false;
        }

        if (group === "") {
            document.getElementById("err-bgroup").innerText = "Select a blood group";
            valid = false;
        }

        if (donated === null) {
            document.getElementById("err-donated").innerText = "Choose Yes or No";
            valid = false;
        }

        if (!agree) {
            document.getElementById("err-agree").innerText = "You must tick the box";
            valid = false;
        }

        if (password.length < 6) {
            document.getElementById("err-pass").innerText = "Password must have at least 6 characters";
            valid = false;
        }

        if (confirmPassword === "") {
            document.getElementById("err-pass2").innerText = "Confirm Password is required";
            valid = false;
        }
        else if (password !== confirmPassword) {
            document.getElementById("err-pass2").innerText = "Passwords do not match";
            valid = false;
        }

        if (valid) {

            let donor = {
                name: name,
                id: id,
                group: group
            };

            donors.push(donor);

            addDonor(donor);
            updateCount();

            document.getElementById("regForm").reset();
        }

        return false;
    }

    function addDonor(donor) {

        let tbody = document.getElementById("donorBody");
        let row = document.createElement("tr");

        let nameCell = document.createElement("td");
        let idCell = document.createElement("td");
        let groupCell = document.createElement("td");
        let actionCell = document.createElement("td");

        nameCell.innerText = donor.name;
        idCell.innerText = donor.id;
        groupCell.innerText = donor.group;

        let removeBtn = document.createElement("button");

        removeBtn.innerText = "Remove";
        removeBtn.type = "button";
        removeBtn.className = "remove";

        removeBtn.onclick = function() {
            removeDonor(donor, row);
        };

        actionCell.appendChild(removeBtn);

        row.appendChild(nameCell);
        row.appendChild(idCell);
        row.appendChild(groupCell);
        row.appendChild(actionCell);

        tbody.appendChild(row);
    }

    function removeDonor(donor, row) {

        let index = donors.indexOf(donor);

        if (index !== -1) {
            donors.splice(index, 1);
            row.remove();
            updateCount();
        }
    }

    function updateCount() {
        document.getElementById("count").innerText = "Total donors: " + donors.length;
    }
</script>

</body>
</html>
