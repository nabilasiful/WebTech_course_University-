<!DOCTYPE html>
<html>

<title>Lab Task 1</title>

</head>
<body>
  <style>
h1{

    text-align: center;
    color: blue;
}
h2{
     text-align: center;
    color: green ;
    
}
p{
        text-align: center;
    }


  </style>  

<h1>Programming Club</h1>
<h2>Club Membership</h2>
<p> Join the programming club to take part in contest workshops and weekly meetups </p>
<form action="#" method="post">
    <fieldset>
        <legend>Join the Club</legend>

        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" minlength="3" required>
        <br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="studentid">Student ID:</label><br>
        <input type="text" id="studentid" name="studentid"
               placeholder="24-56789-1"
               pattern="[0-9]{2}-[0-9]{5}-[0-9]"
               required>
        <br><br>

        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age"
               min="17" max="40" required>
        <br><br>

        <p3>Membership Type:</p3>
        <input type="radio" id="general" name="membership"
               value="General" required>
        <label for="general">General</label>

        <input type="radio" id="executive" name="membership"
               value="Executive">
        <label for="executive">Executive</label>
        <br><br>

        <label for="club">Preferred Club:</label><br>
        <select id="club" name="club" required>
            <option value="">Select a club</option>
            <option value="Programming">Programming</option>
            <option value="Robotics">Robotics</option>
            <option value="Debate">Debate</option>
        </select>
        <br><br>

        <label for="reason">Why do you want to join?</label><br>
        <textarea id="reason" name="reason"
                  maxlength="200" required></textarea>
        <br><br>

        <input type="checkbox" id="agree" name="agree"
               value="yes" required>
        <label for="agree">I agree to the club rules</label>
        <br><br>

        <button type="submit">Join Now</button>
    </fieldset>
</form>


</body>
</html>
